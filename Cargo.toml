[package]
name = "xgameruntime-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "xgameruntime"
crate-type = ["cdylib", "rlib"]

[dependencies]
# XML wire format for xodus-service's loopback IPC (src/ipc.rs) - the request/response
# shapes live in xodus-ipc-models (a sub-crate of the xodus repo), the single source of
# truth both this DLL and xodus-service serialize against, so the two hand-mirrored copies
# can't drift apart. Pinned by git rev in CI; overridden to a local path in development.
xodus-ipc-models = { git = "https://github.com/xodus-gaming/xodus", branch = "main" }
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.40.1", features = ["serialize"] }

[dependencies.windows-core]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows-strings]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows-sys]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true
features = ["libloaderapi"]

[dependencies.windows-canvas]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows-window]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows-reference]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows-future]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows-collections]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows-time]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true
features = [
    "ApplicationModel_Core",
    "UI_Core",
    "combaseapi",
    "objbase",
    "winuser",
    "windef",
    "std",
    "Data_Xml_Dom",
    "Devices_Enumeration",
    "Foundation",
    "Security_Credentials_UI",
    "Security_Cryptography_DataProtection",
    "std",
    "Storage_FileProperties",
    "Storage_Pickers",
    "Storage_Provider",
    "Storage_Search",
    "Storage_Streams",
    "UI",
    "Web_Syndication",
    "bits",
    "combaseapi",
    "exdisp",
    "handleapi",
    "libloaderapi",
    "memorybuffer",
    "minwinbase",
    "minwindef",
    "objbase",
    "objidlbase",
    "oaidl",
    "oleauto",
    "oleidl",
    "pdh",
    "processthreadsapi",
    "ro",
    "rpc",
    "securitybaseapi",
    "servprov",
    "shellapi",
    "shldisp",
    "shlguid",
    "shlobj_core",
    "shobjidl_core",
    "shtypes",
    "synchapi",
    "threadpoolapiset",
    "urlmon",
    "userconsentverifierinterop",
    "wbemcli",
    "winbase",
    "wincred",
    "windef",
    "winnt",
    "winuser",
    "wtypes",
    "wtypesbase",
]

# Development override: until the xodus-ipc-models crate is pushed to
# github.com/xodus-gaming/xodus, resolve it from the sibling checkout on disk.
[patch."https://github.com/xodus-gaming/xodus"]
xodus-ipc-models = { path = "../xodus/crates/xodus-ipc-models" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
