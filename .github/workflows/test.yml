name: Rust check

on:
  pull_request:
  push:
    branches: [main]

# Ubuntu's own `wine`/`wine64-tools` packages don't ship the `x86_64-windows` import
# libraries `lld-link-winegcc` links against - only WineHQ's own builds do. Both jobs
# below need them, so the install step is factored out via a YAML anchor.
jobs:
  fmt:
    name: Check fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --check --all

  # The build developers actually use: cross-compile to windows-msvc with clang against
  # Wine's import libraries, then run the tests under Wine. This is the only job that
  # runs tests - the crate has no host-native build, so without Wine there is nowhere to
  # execute them. See .cargo/config.toml.
  linux-wine:
    name: Check and test (Linux + Wine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - &cache-winehq-apt
        name: Cache WineHQ apt packages
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-apt-winehq-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-winehq-
      - name: Install the WineHQ toolchain
        run: &install-winehq |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update
          mkdir -p "$HOME/apt-cache/partial"
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get install -y --no-install-recommends --download-only -o Dir::Cache::Archives="$HOME/apt-cache" winehq-devel clang lld zsh
          fi
          sudo dpkg -i "$HOME"/apt-cache/*.deb || sudo apt-get install -f -y
      - uses: Swatinem/rust-cache@v2
      - name: Add the target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Run check
        run: cargo check --workspace
      - name: Run tests
        run: cargo test --workspace
        env:
          WINEDEBUG: -all

  # The build developers actually ship: scripts/build-release.sh cross-compiles both halves
  # and stamps the DLL as a Wine builtin, neither of which a plain `cargo build` does - see
  # README.md's Building section. This is the source of the published artifact.
  build:
    name: Build release (build-release.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - *cache-winehq-apt
      - name: Install the WineHQ toolchain
        run: *install-winehq
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            unixlib
      - name: Add the target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Cache cargo-zigbuild
        id: cache-cargo-zigbuild
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-bin-${{ runner.os }}-v1
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ziglang-v1
      - name: Install the zig toolchain
        run: |
          pip install ziglang
          if [ ! -x ~/.cargo/bin/cargo-zigbuild ]; then cargo install cargo-zigbuild; fi
      - name: Run scripts/build-release.sh
        run: ./scripts/build-release.sh
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: xgameruntime
          path: |
            target/x86_64-pc-windows-msvc/release/xgameruntime.dll
            target/x86_64-pc-windows-msvc/release/xgameruntime-x86_64.so
            target/x86_64-pc-windows-msvc/release/xgameruntime-aarch64.so
          if-no-files-found: error

  unixlib-arm64:
    name: Check and test unixlib (native arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: unixlib
      - name: Run check
        run: cargo check --workspace
        working-directory: unixlib
      - name: Run tests
        run: cargo test --workspace
        working-directory: unixlib
